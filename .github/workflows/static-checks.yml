name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Verify essential static files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
